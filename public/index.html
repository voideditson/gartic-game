<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gartic Studio: Touch & Stylus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
    body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; touch-action: none; }
    
    #toolbar { background: #1e293b; padding: 0.8rem 1.5rem; border-radius: 0.75rem; display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; border: 1px solid #334155; }
    .tool-btn { background: #334155; color: #fff; border: 2px solid transparent; padding: 0.6rem 1rem; border-radius: 0.5rem; cursor: pointer; font-weight: bold; }
    .tool-btn.active { background: #2563eb; border-color: #38bdf8; }
    
    input[type="color"] { border: none; width: 40px; height: 40px; border-radius: 0.5rem; cursor: pointer; background: none; }
    input[type="range"] { width: 100px; }

    #canvas-container { border: 3px solid #38bdf8; border-radius: 0.75rem; background: #ffffff; box-shadow: 0 10px 25px rgba(0,0,0,0.5); cursor: crosshair; touch-action: none; }
    canvas { display: block; border-radius: 0.5rem; touch-action: none; }
  </style>
</head>
<body>

  <div id="toolbar">
    <button class="tool-btn active" id="btn-brush" onclick="setTool('brush')">✏️ Brush</button>
    <button class="tool-btn" id="btn-fill" onclick="setTool('fill')">🪣 Fill</button>
    <button class="tool-btn" id="btn-eraser" onclick="setTool('eraser')">🧹 Eraser</button>
    
    <label>Color: <input type="color" id="colorPicker" value="#000000"></label>
    <label>Size: <input type="range" id="sizePicker" min="1" max="50" value="5"></label>
    
    <button class="tool-btn" style="background:#ef4444;" onclick="clearCanvas()">Clear</button>
  </div>

  <div id="canvas-container">
    <canvas id="paintCanvas" width="800" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let currentTool = 'brush';
    let isDrawing = false;
    let currentColor = '#000000';
    let currentSize = 5;

    // Fill canvas initial background with white
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    document.getElementById('colorPicker').addEventListener('change', (e) => currentColor = e.target.value);
    document.getElementById('sizePicker').addEventListener('input', (e) => currentSize = e.target.value);

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${tool}`).classList.add('active');
    }

    function clearCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // --- POINTER EVENTS (Handles Mouse, Touch, & Stylus/Pen Natively) ---
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);

      if (currentTool === 'fill') {
        floodFill(x, y, hexToRgba(currentColor));
      } else {
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(x, y);
        
        // Dynamically scale size if stylus supports pressure sensitivity
        let pressureSize = (e.pressure && e.pressure > 0) ? currentSize * e.pressure * 2 : currentSize;
        ctx.lineWidth = pressureSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      e.preventDefault();
      if (!isDrawing || currentTool === 'fill') return;

      const rect = canvas.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);

      let pressureSize = (e.pressure && e.pressure > 0) ? currentSize * e.pressure * 2 : currentSize;
      ctx.lineWidth = pressureSize;
      
      ctx.lineTo(x, y);
      ctx.stroke();
    });

    canvas.addEventListener('pointerup', () => isDrawing = false);
    canvas.addEventListener('pointerleave', () => isDrawing = false);

    // --- FLOOD FILL ALGORITHM ---
    function floodFill(startX, startY, fillColor) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      
      const startPos = (startY * canvas.width + startX) * 4;
      const startR = data[startPos];
      const startG = data[startPos + 1];
      const startB = data[startPos + 2];
      const startA = data[startPos + 3];

      // Don't fill if target color is identical to fill color
      if (colorsMatch([startR, startG, startB, startA], fillColor)) return;

      const pixelStack = [[startX, startY]];

      while (pixelStack.length > 0) {
        const [x, y] = pixelStack.pop();
        let currentPos = (y * canvas.width + x) * 4;

        let newY = y;
        while (newY >= 0 && matchStartColor(currentPos, startR, startG, startB, startA)) {
          newY--;
          currentPos -= canvas.width * 4;
        }

        currentPos += canvas.width * 4;
        newY++;

        let reachLeft = false;
        let reachRight = false;

        while (newY < canvas.height && matchStartColor(currentPos, startR, startG, startB, startA)) {
          colorPixel(currentPos, fillColor);

          if (x > 0) {
            if (matchStartColor(currentPos - 4, startR, startG, startB, startA)) {
              if (!reachLeft) {
                pixelStack.push([x - 1, newY]);
                reachLeft = true;
              }
            } else if (reachLeft) {
              reachLeft = false;
            }
          }

          if (x < canvas.width - 1) {
            if (matchStartColor(currentPos + 4, startR, startG, startB, startA)) {
              if (!reachRight) {
                pixelStack.push([x + 1, newY]);
                reachRight = true;
              }
            } else if (reachRight) {
              reachRight = false;
            }
          }

          newY++;
          currentPos += canvas.width * 4;
        }
      }

      ctx.putImageData(imgData, 0, 0);

      function matchStartColor(pos, r, g, b, a) {
        return Math.abs(data[pos] - r) < 30 &&
               Math.abs(data[pos+1] - g) < 30 &&
               Math.abs(data[pos+2] - b) < 30 &&
               Math.abs(data[pos+3] - a) < 30;
      }

      function colorPixel(pos, color) {
        data[pos] = color[0];
        data[pos + 1] = color[1];
        data[pos + 2] = color[2];
        data[pos + 3] = 255;
      }
    }

    function colorsMatch(a, b) {
      return a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
    }

    function hexToRgba(hex) {
      let c = hex.substring(1);
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
    }
  </script>
</body>
</html>
